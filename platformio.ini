[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_size = 16MB

lib_deps =
    ESP Async WebServer
    AsyncTCP
    ArduinoJson
    WiFiClientSecure

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
